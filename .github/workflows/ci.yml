name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-host:
    name: Build and test (software port, x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: chocotechnologies/dmod:1.0.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build dmcrypto with the software port
        run: |
          mkdir -p build
          cd build
          cmake .. -DDMOD_MODE=DMOD_MODULE -DDMOD_CPU_FAMILY=sw -DDMOD_TOOLS_NAME=arch/x86_64
          cmake --build .

      - name: Verify module files
        run: |
          ls -lh build/dmf/
          test -f build/dmf/dmcrypto.dmf
          test -f build/dmf/dmcrypto_port.dmf
          test -f build/dmf/test_dmcrypto.dmf

      - name: Run tests with dmod_loader
        run: |
          export DMOD_DMF_DIR=$(pwd)/build/dmf
          dmf-get install -d ${DMOD_DMF_DIR}/test_dmcrypto-local.dmd -y
          dmod_loader build/dmf/test_dmcrypto.dmf

  ports-manifests:
    name: Check src/port/*/mcus.txt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate the per-MCU manifests
        run: |
          scripts/gen-ports-manifests.sh ports-manifests
          # Every family with a port has its list of chips
          for dir in $(find src/port -mindepth 2 -maxdepth 2 -name port.c -printf '%h\n'); do
            test -f "$dir/mcus.txt" || { echo "$dir/mcus.txt is missing"; exit 1; }
          done
