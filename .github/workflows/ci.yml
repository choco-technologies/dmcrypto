name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-host:
    name: Build and test (software port, x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: chocotechnologies/dmod:1.0.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build dmcrypto with the software port
        run: |
          mkdir -p build
          cd build
          cmake .. -DDMOD_MODE=DMOD_MODULE -DDMOD_CPU_FAMILY=sw -DDMOD_TOOLS_NAME=arch/x86_64
          cmake --build .

      - name: Verify module files
        run: |
          ls -lh build/dmf/
          test -f build/dmf/dmcrypto.dmf
          test -f build/dmf/dmcrypto_port.dmf
          test -f build/dmf/test_dmcrypto.dmf

      - name: Run tests with dmod_loader
        run: |
          export DMOD_DMF_DIR=$(pwd)/build/dmf
          dmf-get install -d ${DMOD_DMF_DIR}/test_dmcrypto-local.dmd -y
          dmod_loader build/dmf/test_dmcrypto.dmf

  ports-manifests:
    name: Check src/port/*/mcus.txt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate the per-MCU manifests
        run: |
          scripts/gen-ports-manifests.sh ports-manifests
          # Every family with a port has its list of chips
          for dir in $(find src/port -mindepth 2 -maxdepth 2 -name port.c -printf '%h\n'); do
            test -f "$dir/mcus.txt" || { echo "$dir/mcus.txt is missing"; exit 1; }
          done

  discover-architectures:
    name: Discover Architectures
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      architectures: ${{ steps.list-archs.outputs.architectures }}
    steps:
      - name: Fetch dmod to discover architectures
        run: |
          # Only dmod itself: this step needs nothing else this repo fetches
          git clone --depth 1 https://github.com/choco-technologies/dmod.git dmod_discovery

      - name: List available architectures
        id: list-archs
        run: |
          ARCHS=$(find dmod_discovery/configs/arch -name "tools-cfg.cmake" | \
            sed "s|dmod_discovery/configs/arch/||g" | \
            sed 's|/tools-cfg.cmake||g' | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "Found architectures: $ARCHS"
          echo "architectures=$ARCHS" >> $GITHUB_OUTPUT

  discover-cpu-families:
    name: Discover CPU Families
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cpu_families: ${{ steps.list-families.outputs.cpu_families }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List available CPU families
        id: list-families
        run: |
          # sw is the software port, built per architecture (build-sw)
          CPU_FAMILIES=$(find src/port -mindepth 2 -maxdepth 2 -name "port.c" -type f -printf '%h\n' | \
            xargs -n1 basename | \
            grep -vx 'sw' | \
            sort | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "Found CPU families: $CPU_FAMILIES"
          echo "cpu_families=$CPU_FAMILIES" >> $GITHUB_OUTPUT

  build-sw:
    name: Software port for ${{ matrix.arch_name }}
    needs: discover-architectures
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch_name: ${{ fromJson(needs.discover-architectures.outputs.architectures) }}

    container:
      image: chocotechnologies/dmod:1.0.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build for ${{ matrix.arch_name }}
        run: |
          set -e
          ARCH_DIR_NAME=$(echo "${{ matrix.arch_name }}" | sed 's|/|-|')
          mkdir -p build_$ARCH_DIR_NAME
          cd build_$ARCH_DIR_NAME
          cmake .. -DDMOD_CPU_FAMILY=sw -DDMOD_TOOLS_NAME=arch/${{ matrix.arch_name }}
          cmake --build .
          test -f dmf/dmcrypto.dmf
          test -f dmf/dmcrypto_port.dmf

  build-hw:
    name: Hardware port for ${{ matrix.cpu_family }}
    needs: discover-cpu-families
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        cpu_family: ${{ fromJson(needs.discover-cpu-families.outputs.cpu_families) }}

    container:
      image: chocotechnologies/dmod:1.0.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build for ${{ matrix.cpu_family }}
        run: |
          set -e
          mkdir -p build_${{ matrix.cpu_family }}
          cd build_${{ matrix.cpu_family }}
          cmake .. -DDMOD_CPU_FAMILY=${{ matrix.cpu_family }}
          cmake --build .
          test -f dmf/dmcrypto_port.dmf
          test -f dmf/dmcrypto_port_version.txt
