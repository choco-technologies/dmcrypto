; dmcrypto's node, /dev/crypto - needed so that dmdevfs creates the driver at
; all (the driver is what gives dmcrypto its entropy source). The section name
; is the node's name.
;
;   entropy  a node that returns random bytes when read: dmrng's /dev/rng
;            (STM32F746G-DISCO: the on-chip RNG, rng.ini of dmrng). Without a
;            source dmcrypto_random() returns -ENODEV; there is no software
;            fallback. "entropy=" (empty) leaves the source to the application
;            (dmcrypto_set_entropy()).
[crypto]
driver_name=dmcrypto
driver_order=1
entropy=/dev/rng
